<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Закарпатський Клікер</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #d84315;
            --bg-color: #1b2e1f;
            --card-bg: #2d4a35;
            --text-color: #fff8e1;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-color), #0f1c11);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 14px;
            color: #a5d6a7;
        }

        .score-board {
            background: var(--card-bg);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 15px 25px;
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #score {
            font-size: 36px;
            font-weight: bold;
            color: #ffcc00;
            margin: 5px 0;
        }

        .clicker-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffb300, #f57c00);
            border: 6px solid #fff8e1;
            box-shadow: 0 8px 25px rgba(245, 124, 0, 0.5);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 20px 0;
        }

        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(245, 124, 0, 0.5);
        }

        .clicker-icon {
            font-size: 50px;
        }

        .clicker-text {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .upgrades-section {
            width: 100%;
            margin-top: 10px;
        }

        h2 {
            font-size: 18px;
            color: #ffcc00;
            border-bottom: 2px solid #2d4a35;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .upgrade-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #4caf50;
        }

        .upgrade-info h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 12px;
            color: #a5d6a7;
        }

        .buy-btn {
            background: #ffcc00;
            color: #1b2e1f;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: #ffea00;
        }

        .buy-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .floating-score {
            position: absolute;
            font-weight: bold;
            color: #ffcc00;
            font-size: 20px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⛰️ Закарпатський Клікер</h1>
            <div class="subtitle"> назбирай на бограч та чани!</div>
        </header>

        <div class="score-board">
            <div>Бали (гроші):</div>
            <div id="score">0</div>
            <div style="font-size: 12px; color: #a5d6a7;" id="cps">Дохід за сек: 0</div>
        </div>

        <div class="clicker-btn" id="clickBtn">
            <span class="clicker-icon">🫕</span>
            <span class="clicker-text">Клік!</span>
        </div>

        <div class="upgrades-section">
            <h2>Покращення</h2>
            
            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>🪵 Трембіта</h3>
                    <p>+1 клік за раз | Ціна: <span id="c1-cost">15</span></p>
                </div>
                <button class="buy-btn" id="buyClicker" onclick="buyClickUpgrade()">Купити</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>♨️ Мінеральний чан</h3>
                    <p>+1 бал/сек | Ціна: <span id="c2-cost">50</span></p>
                </div>
                <button class="buy-btn" id="buyAuto1" onclick="buyAutoUpgrade(1, 50, 'c2-cost', 'auto1-count')">Купити (<span id="auto1-count">0</span>)</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>🧀 Полонина бринзи</h3>
                    <p>+8 балів/сек | Ціна: <span id="c3-cost">300</span></p>
                </div>
                <button class="buy-btn" id="buyAuto2" onclick="buyAutoUpgrade(8, 300, 'c3-cost', 'auto2-count')">Купити (<span id="auto2-count">0</span>)</button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;
        let cps = 0;

        let auto1Count = 0;
        let auto1Cost = 50;

        let auto2Count = 0;
        let auto2Cost = 300;

        let clickUpgradeCost = 15;

        const scoreEl = document.getElementById('score');
        const cpsEl = document.getElementById('cps');
        const clickBtn = document.getElementById('clickBtn');

        // Клік по головній кнопці
        clickBtn.addEventListener('click', (e) => {
            score += clickPower;
            updateUI();
            
            // Анімація чисел при кліку
            const rect = clickBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const floatText = document.createElement('div');
            floatText.className = 'floating-score';
            floatText.innerText = `+${clickPower}`;
            floatText.style.left = `${x}px`;
            floatText.style.top = `${y}px`;
            clickBtn.appendChild(floatText);

            setTimeout(() => floatText.remove(), 800);
        });

        // Покращення сили кліку (Трембіта)
        function buyClickUpgrade() {
            if (score >= clickUpgradeCost) {
                score -= clickUpgradeCost;
                clickPower += 1;
                clickUpgradeCost = Math.floor(clickUpgradeCost * 1.5);
                document.getElementById('c1-cost').innerText = clickUpgradeCost;
                updateUI();
            }
        }

        // Автоматичний дохід (Чани, Полонини)
        function buyAutoUpgrade(powerAdd, baseCost, costElementId, countElementId) {
            let cost = parseInt(document.getElementById(costElementId).innerText);
            if (score >= cost) {
                score -= cost;
                cps += powerAdd;
                
                if(powerAdd === 1) {
                    auto1Count++;
                    document.getElementById(countElementId).innerText = auto1Count;
                    auto1Cost = Math.floor(baseCost * 1.4);
                    document.getElementById(costElementId).innerText = auto1Cost;
                } else {
                    auto2Count++;
                    document.getElementById(countElementId).innerText = auto2Count;
                    auto2Cost = Math.floor(baseCost * 1.4);
                    document.getElementById(costElementId).innerText = auto2Cost;
                }
                updateUI();
            }
        }

        // Пасивний дохід каждую секунду
        setInterval(() => {
            if (cps > 0) {
                score += cps;
                updateUI();
            }
        }, 1000);

        function updateUI() {
            scoreEl.innerText = score;
            cpsEl.innerText = `Дохід за сек: ${cps}`;

            // Активуємо/деактивуємо кнопки залежно від кількості балів
            document.getElementById('buyClicker').disabled = score < clickUpgradeCost;
            document.getElementById('buyAuto1').disabled = score < parseInt(document.getElementById('c2-cost').innerText);
            document.getElementById('buyAuto2').disabled = score < parseInt(document.getElementById('c3-cost').innerText);
        }

        // Оновлення інтерфейсу початкове
        updateUI();
    </script>
</body>
</html>
