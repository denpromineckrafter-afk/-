<!-- Фонова музика із вашого файлу music.mp3 -->
<audio id="bgMusic" loop>
    <source src="музыка.mp3music.mp3" type="audio/mp3">
</audio>

<!-- Кнопка керування музикою -->
<button class="music-toggle" id="musicBtn" onclick="toggleMusic()">🎵 Музика: Викл</button>

<script>
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isMusicPlaying = false;

    function toggleMusic() {
        if (isMusicPlaying) {
            bgMusic.pause();
            musicBtn.innerText = "🎵 Музика: Викл";
            isMusicPlaying = false;
        } else {
            bgMusic.play().then(() => {
                musicBtn.innerText = "🎵 Музика: Вкл";
                isMusicPlaying = true;
            }).catch(e => console.log("Потрібна дія користувача для запуску аудіо"));
        }
    }
</script>
