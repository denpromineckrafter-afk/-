<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мій Клікер</title>
    <!-- Підключаємо Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, #212121);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .score-container {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .clicker-btn {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(255, 119, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(255, 119, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="score-container" id="score">0</div>
    <button class="clicker-btn" id="clickBtn">TAP</button>

    <script>
        // Ініціалізація Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо на весь екран

        let score = 0;
        const scoreElement = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');

        // Завантаження збережених очок з пам'яті телефону (якщо є)
        if (localStorage.getItem('clicker_score')) {
            score = parseInt(localStorage.getItem('clicker_score'));
            scoreElement.textContent = score;
        }

        // Обробка кліку
        clickBtn.addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score;
            
            // Зберігаємо в пам'ять браузера
            localStorage.setItem('clicker_score', score);

            // Легка вібрація телефону при кліку (якщо підтримується Telegram)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
    </script>

</body>
</html>
